server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-english-learning

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SmartEnglishLearningDB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        # Bắt buộc giữ nguyên tên thuộc tính Java sang tên cột DB (camelCase: userId, roleId, isPlacementCompleted,...)
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

# JWT Configuration (Khóa ký lấy từ biến môi trường JWT_SECRET trong .env)
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

# AI & LLM Integration Configuration (Google Gemini)
ai:
  llm:
    # Endpoint chuẩn OpenAI tương thích chính thức của Google Gemini
    api-url: ${AI_LLM_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
    # API Key được lấy tự động từ file .env (hoặc biến môi trường hệ thống AI_LLM_API_KEY)
    api-key: ${AI_LLM_API_KEY:}
    # Model Gemini tối ưu nhất cho việc sinh JSON cấu trúc lộ trình học
    model: ${AI_LLM_MODEL:gemini-3.5-flash-lite}
    # Đổi thành false trong .env để gọi Gemini thật (hoặc true nếu muốn chạy thử nghiệm không cần mạng/key)
    mock-enabled: ${AI_LLM_MOCK_ENABLED:true}

# OpenAPI / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

logging:
  level:
    root: INFO
    com.smartenglish: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
